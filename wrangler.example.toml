# Template for wrangler.toml, which is gitignored because it holds
# account-specific values. Copy it and fill in the two placeholders:
#
#   cp wrangler.example.toml wrangler.toml
#
# - routes.pattern: the custom domain this Worker is served from. It must
#   already exist as a zone on your Cloudflare account. Access is expected to
#   protect it (see CF_ACCESS_TEAM_DOMAIN / CF_ACCESS_AUD in the README).
# - d1_databases.database_id: `npx wrangler d1 create minimax-chat-memory`
#   prints this, or `npx wrangler d1 info minimax-chat-memory` for an
#   existing one.

name = "minimax-chat"
main = "worker/index.ts"
compatibility_date = "2026-07-01"
workers_dev = false

routes = [
  { pattern = "<YOUR_CUSTOM_DOMAIN>", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
MINIMAX_BASE_URL = "https://api.minimax.io"
ASR_PROVIDER = "groq"
ASR_BASE_URL = "https://api.groq.com/openai/v1"
ASR_MODEL = "whisper-large-v3-turbo"

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "minimax-memory"

[[d1_databases]]
binding = "DB"
database_name = "minimax-chat-memory"
database_id = "<YOUR_D1_DATABASE_ID>"
migrations_dir = "worker/migrations"
